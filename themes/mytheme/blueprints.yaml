name: 'My Theme'
version: 2.0.0
description: 'Customizing Bootstrap4 Open Matter'
icon: crosshairs
author:
  name: 'Paul Hibbitts'
  email: paul@hibbittsdesign.org
  url: 'http://hibbittsdesign.org'
compatibility:
  grav: ['1.7', '2.0']

# The settings come from the parent theme, Bootstrap4 Open Matter, so any change to
# its settings also shows here, with no copy to keep in step
extends@:
  type: bootstrap4-open-matter/blueprints
  context: 'themes://'
